source_code:
  github_org: https://github.com/FlareTx
  detail: >-
    Flare Therapeutics operates a GitHub organization with seven public repositories, wired in
    apis.yml as GitHubOrganization. Every one of them is a FORK of third-party open source, not
    first-party software the company publishes — api, ui, worker, pipeline and iac are forks of the
    hms-dbmi-cellenics / Biomage single-cell analysis platform, and claude-mem is a fork of
    thedotmack/claude-mem. This is a research-computing deployment, not a developer product.
  rejected_contract:
    url: https://raw.githubusercontent.com/FlareTx/api/master/src/specs/api.v2.yaml
    http_status: 200
    parses_as: OpenAPI 3.0.0
    decision: NOT SAVED
    reason: >-
      STEP 0c ownership check. The document is real and parses, but it says plainly that it belongs
      to someone else — info.title "API", info.contact.name "Cellenics", license URL
      https://github.com/hms-dbmi-cellenics/api/blob/master/LICENSE, and servers `- url: /v2` with no
      host at all. It is the Cellenics/Biomage single-cell analysis API from Harvard Medical School's
      Department of Biomedical Informatics, sitting in an unmodified-except-stale Flare fork (the
      fork still carries the `seurat` routes upstream has since renamed to `obj2s`). No Flare host
      serves it — api.flaretx.com is NXDOMAIN. Saving it would have credited Flare Therapeutics with
      a 3,000-line public API it has never shipped and would have contaminated every derived
      artifact in this repo.
    checked: '2026-08-12'
