aid: flare-therapeutics
name: Flare Therapeutics
description: >-
  Flare Therapeutics is a clinical-stage biotechnology company headquartered at 400 Technology
  Square, Cambridge, Massachusetts, developing small-molecule precision medicines against
  transcription factors — a target class long considered undruggable. Its platform combines a
  "switch site" hypothesis with cell-based ligand discovery and chemoproteomics to find binding
  pockets on transcription factors that control cancer cell states. The company launched publicly in
  May 2021 with an $82 million Series A led by Third Rock Ventures, and closed an $85 million
  insider-led Series C on 30 June 2026 led by Third Rock Ventures and Nextech Invest with Pfizer
  Ventures, Boxer Capital, GordonMD Global Investments, Invus, Casdin Capital, Eli Lilly, Novartis,
  Agent Capital and Eventide Asset Management participating, appointing Anna Protopapas as Chief
  Executive Officer at the same time. Its clinical-stage lead FX-909 is a PPARG inverse agonist in
  advanced urothelial cancer; FX-111 is an androgen-receptor-directed program in prostate cancer
  that received FDA IND clearance ahead of a clinical start in the third quarter of 2026. Flare also
  runs a discovery collaboration with Roche on undrugged transcription factor targets in oncology.
  Flare Therapeutics operates no developer program and publishes no product API, developer portal or
  API documentation. The only machine-readable surface reachable without credentials is the
  WordPress REST content API behind www.flaretx.com, catalogued here.
