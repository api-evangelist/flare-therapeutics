- id: model-context-protocol
  conforms: false
  gated: true
  evidence: >-
    The site registers the WordPress core Abilities API at /wp-json/wp-abilities/v1/ (6 routes),
    which is the closest thing on the deployment to an agent surface. Every route returned 401
    rest_forbidden anonymously, and a JSON-RPC {"jsonrpc":"2.0","id":1,"method":"tools/list"} POST
