regulatory_context:
  note: >-
    Flare Therapeutics is a clinical-stage biotechnology company. It is subject to FDA regulation of
    its investigational products — FX-111 received IND clearance ahead of a Q3 2026 clinical start,
    and FX-909 is in clinical development in advanced urothelial cancer — but that is
    drug-development regulation, not API or data-processing regulation, and it confers nothing on
    the public content API catalogued here. The site publishes a Privacy Policy and Terms of Use;
    neither describes an API, a data-processing agreement or a compliance certification. No HIPAA,
    GDPR, SOC 2 or ISO 27001 claim is published anywhere on the public surface, and none is asserted
    on the company's behalf.
