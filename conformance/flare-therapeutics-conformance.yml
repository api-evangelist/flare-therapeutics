    administrative surface bound to an authenticated user, not an agent endpoint Flare Therapeutics
    publishes for consumers. No MCPServer pointer is emitted and no tool list is derived — the live
    schema is auth-gated and inventing one would fabricate an agent posture this provider does not
    have.
- id: graphql
